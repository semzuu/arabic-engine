<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Arabic Morphological Validator</title>
		<link rel="stylesheet" href="style.css">
		<script src="index.js"></script>
	</head>
	<body>
		<nav class="main-nav">
			<div class="nav-links">
				<a href="validator.html" class="nav-item active">التحقق</a>
				<a href="generator.html" class="nav-item">التوليد</a>
				<a href="manager.html" class="nav-item">الأوزان</a>
				<a href="history.html" class="nav-item">السجل</a>
			</div>
		</nav>
		<div class="container">
			<h1>مُدقق الصرف العربي</h1>

			<div class="input-group">
				<label for="rootInput">الجذر (Root)</label>
				<input type="text" id="rootInput" placeholder="مثال: ك ت ب" autocomplete="off">
			</div>

			<div class="input-group">
				<label for="wordInput">الكلمة (Word)</label>
				<input type="text" id="wordInput" placeholder="مثال: مكتوب" autocomplete="off">
			</div>

			<button onclick="handleValidation()">تحقق من الصحة</button>

			<div id="result-container">
			</div>
		</div>
	</body>
</html>
