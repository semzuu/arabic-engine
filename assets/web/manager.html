<!DOCTYPE html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>إدارة الأوزان - Scheme Manager</title>
		<link rel="stylesheet" href="style.css">
		<script src="index.js"></script>
	</head>
	<body>
		<nav class="main-nav">
			<div class="nav-links">
				<a href="validator.html" class="nav-item">التحقق</a>
				<a href="generator.html" class="nav-item">التوليد</a>
				<a href="manager.html" class="nav-item active">الأوزان</a>
				<a href="history.html" class="nav-item">السجل</a>
			</div>
		</nav>
		<div class="container" style="max-width: 600px;">
			<h1>إدارة أوزان الصرف</h1>
			<div class="form-section">
				<div class="manager-grid">
					<div class="input-group" style="margin:0">
						<label>اسم الوزن</label>
						<input type="text" id="schemeName" placeholder="مثلاً: فاعَل" style="height: 40px;">
					</div>
					<div class="input-group" style="margin:0">
						<label>النمط (Pattern)</label>
						<input type="text" id="schemePattern" placeholder="f-a-a-l" style="height: 40px; direction: ltr;">
					</div>
					<button id="saveBtn" onclick="saveScheme()" style="height: 40px; margin: 0; padding: 0 20px;">حفظ</button>
				</div>
			</div>
			<table class="scheme-table">
				<thead>
					<tr>
						<th>الوزن</th>
						<th>النمط</th>
						<th style="width: 100px;">إجراءات</th>
					</tr>
				</thead>
				<tbody id="schemeListBody">
					<tr class="scheme-item">
						<td>فَعَلَ</td>
						<td><span class="pattern-tag">f-a-l-a</span></td>
						<td>
							<div class="action-btns">
								<button class="edit-btn" onclick="editScheme('فَعَلَ', 'f-a-l-a')" title="تعديل">✎</button>
								<button class="delete-btn" onclick="deleteScheme(this)" title="حذف">✕</button>
							</div>
						</td>
					</tr>
					<tr class="scheme-item">
						<td>أَفْعَلَ</td>
						<td><span class="pattern-tag">a-f-l-a</span></td>
						<td>
							<div class="action-btns">
								<button class="edit-btn" onclick="editScheme('أَفْعَلَ', 'a-f-l-a')" title="تعديل">✎</button>
								<button class="delete-btn" onclick="deleteScheme(this)" title="حذف">✕</button>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</body>
</html>
